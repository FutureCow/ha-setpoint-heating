substitutions:
  device_name: weheat-ot
  friendly_name: "WeHeat OpenTherm"

  # Entiteiten in HA. De namen van de integratie volgen de taal die HA had
  # toen je de integratie toevoegde. Controleer ze onder Instellingen →
  # Entiteiten. In het Engels heten ze sensor.weheat_opentherm_supply_setpoint,
  # sensor.weheat_opentherm_active_mode en climate.weheat_opentherm_heating_target.
  setpoint_entity: sensor.weheat_opentherm_aanvoersetpoint
  mode_entity: sensor.weheat_opentherm_actieve_modus
  thermostat_entity: climate.weheat_opentherm_verwarmingsdoelwit
  # Je eigen kamertemperatuursensor (dezelfde als in de integratie).
  room_temp_entity: sensor.woonkamer_temperatuur

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} AP"
    password: !secret ap_password

captive_portal:

logger:
  level: INFO
  logs:
    component: ERROR
    # Optioneel: ontkoppel onderstaande regel als "Timeout while waiting for
    # response from device" warnings je log volspammen. Dit zijn meestal
    # niet-fatale OT-timeouts waar de slave niet reageert op een specifiek
    # message-ID. Andere opentherm-issues (ERROR-level) blijven zichtbaar.
    # opentherm: ERROR

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

# ─── OpenTherm Hub ───────────────────────────────────────────────────────────
#
# t_set leest het berekende aanvoersetpoint rechtstreeks uit de HA-integratie.
# Entity: ${setpoint_entity} (zie substitutions)
# (aangemaakt door de weheat_opentherm custom integratie)
#
opentherm:
  in_pin: GPIO10
  out_pin: GPIO11
  # sync_mode true = blokkerende reads, betrouwbaarder bij timing-issues.
  # Bij regelmatige "Timeout while waiting for response" warnings is dit
  # een betere keuze dan async (false). Iets trager maar stabieler.
  sync_mode: true
  t_set: stooklijn_setpoint
  t_room: kamertemperatuur
  t_room_set: kamer_setpoint
  # ch_enable wordt beheerd door ch_enable_switch beneden, die automatisch
  # wordt gezet door de automation op text_sensor "actieve_modus".
  # Koelen gaat via de interne stooklijn van de WeHeat (geen OpenTherm).

# ─── Sensors ─────────────────────────────────────────────────────────────────
sensor:
  # Aanvoersetpoint, ontvangen van de HA weheat_opentherm integratie.
  # name: zorgt dat de ontvangen waarde ook als HA-entity zichtbaar wordt
  # (handig om te verifiëren dat de ESP echt waarden binnen krijgt).
  # filter_out: nan zorgt dat het laatste geldige setpoint behouden blijft
  # als de verbinding met HA tijdelijk wegvalt.
  - platform: homeassistant
    id: stooklijn_setpoint
    name: "Aanvoersetpoint (ontvangen van HA)"
    entity_id: ${setpoint_entity}
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - filter_out: nan

  # De waarde die de ESP als t_set op de OpenTherm-bus gebruikt, elke 30 s
  # teruggemeld aan HA. Dit is wat de ESP aanbiedt; of de warmtepomp het heeft
  # overgenomen, zie je alleen aan de pomp zelf (bv. het waterdoel in de
  # WeHeat-integratie). Gelijk aan het setpoint van de integratie, behalve als de
  # verbinding met HA wegvalt: dan blijft hier de laatste geldige waarde staan.
  - platform: template
    name: "Aanvoersetpoint (naar boiler)"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      return id(stooklijn_setpoint).state;

  # Kamertemperatuur — doorgestuurd naar warmtepomp via OpenTherm t_room (ID 24)
  - platform: homeassistant
    id: kamertemperatuur
    entity_id: ${room_temp_entity}
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    filters:
      - filter_out: nan

  # Gewenste kamertemperatuur — doorgestuurd via OpenTherm t_room_set (ID 16).
  # De WeHeat toont deze alleen (anders staat er -1); de regeling zelf zit in
  # het aanvoersetpoint van de integratie.
  - platform: homeassistant
    id: kamer_setpoint
    entity_id: ${thermostat_entity}
    attribute: temperature
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    filters:
      - filter_out: nan

  # OpenTherm boilersensoren
  # Filters: OpenTherm geeft temperaturen in stappen van 1/256 °C. Zonder filter
  # wordt elke minieme schommeling een nieuwe state in de recorder (~25.000/dag).
  # throttle_average: hooguit eens per 30 s een gemiddelde, zodat een waarde op
  # een afrondingsgrens niet heen en weer springt.
  # delta 0.05 in plaats van 0.1: na afronden kan een stap van 0,1 door
  # floating point net onder 0,1 uitkomen en dan tegengehouden worden.
  # CV-druk, branderstarts, branderuren en CV-pompuren zijn weggelaten: de
  # Flint P40 geeft daar altijd 0 en ze kosten alleen tijd op de OpenTherm-bus.
  - platform: opentherm
    rel_mod_level:
      name: "Modulatieniveau"
      unit_of_measurement: "%"
      filters:
        - delta: 1
    t_boiler:
      name: "Aanvoertemperatuur (gemeten)"
      unit_of_measurement: "°C"
      filters:
        - throttle_average: 30s
        - round: 1
        - delta: 0.05
    t_ret:
      name: "Retourtemperatuur"
      unit_of_measurement: "°C"
      filters:
        - throttle_average: 30s
        - round: 1
        - delta: 0.05
    t_outside:
      name: "Buitentemperatuur (WeHeat)"
      unit_of_measurement: "°C"
      filters:
        - throttle_average: 30s
        - round: 1
        - delta: 0.05

  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "WiFi signaal"
    update_interval: 60s

# ─── Binary Sensors ───────────────────────────────────────────────────────────
binary_sensor:
  - platform: opentherm
    flame_on:
      name: "Brander aan"
    ch_active:
      name: "CV actief"
    fault_indication:
      name: "Storing"
      device_class: problem
      entity_category: diagnostic
    diagnostic_indication:
      name: "Diagnose-event"
      entity_category: diagnostic
    low_water_pressure:
      name: "Lage waterdruk"
      device_class: problem
      entity_category: diagnostic
  - platform: status
    name: "Apparaatstatus"

# ─── Switches ─────────────────────────────────────────────────────────────────
# ch_enable wordt automatisch gezet door de automation op text_sensor
# "actieve_modus" hieronder. Diagnostic-categorie: zichtbaar in HA voor debug,
# maar handmatige toggle wordt direct overschreven zodra de integratie een
# nieuwe modus stuurt.
# RESTORE_DEFAULT_OFF: na een herstart van de ESP komt de laatste stand terug,
# zodat de warmtepomp niet uitgaat tot HA opnieuw de modus heeft gestuurd.
switch:
  - platform: opentherm
    ch_enable:
      name: "CV inschakelen"
      id: ch_enable_switch
      restore_mode: RESTORE_DEFAULT_OFF
      entity_category: diagnostic

status_led:
  pin: GPIO8

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP-adres"

  # Leest de EFFECTIEVE modus uit de integratie ("heat" of "off").
  # "heat" bij climate=HEAT en buitentemp onder de stookgrens; anders "off".
  # on_value automation schakelt ch_enable_switch synchroon mee.
  # Alleen "heat" en "off" schakelen: bij "unavailable"/"unknown" (bv. terwijl
  # HA herstart en de integratie nog laadt) blijft de laatste stand staan,
  # zodat de warmtepomp niet even uitgaat.
  - platform: homeassistant
    id: actieve_modus
    name: "Actieve modus (van integratie)"
    entity_id: ${mode_entity}
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x == "heat";'
            then:
              - switch.turn_on: ch_enable_switch
        - if:
            condition:
              lambda: 'return x == "off";'
            then:
              - switch.turn_off: ch_enable_switch
