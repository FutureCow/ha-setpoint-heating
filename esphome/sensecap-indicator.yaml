# ============================================================
#  SenseCAP Indicator D1 — Thermostaat voor de OpenTherm-setpoint-integratie
#  ESPHome 2026.x  |  mipi_rgb platform  |  LVGL v9
#  v2.0 — 2026-11-14 (algemene versie, reistijden weg, groter scherm)
#
#  Optioneel: een wandscherm dat de kamertemperatuur, het doel en het
#  aanvoersetpoint toont, en waarmee je het doel met − en + verandert.
# ============================================================

substitutions:
  device_name: sensecap-indicator
  friendly_name: "SenseCAP Indicator"

  # ── In te vullen: jouw entiteiten ─────────────────────────────
  # Climate-entiteit van de integratie. De naam volgt de taal die HA had toen
  # je de integratie toevoegde. Nederlands: climate.weheat_opentherm_verwarmingsdoelwit,
  # Engels: climate.weheat_opentherm_heating_target.
  thermostat_entity: "climate.weheat_opentherm_verwarmingsdoelwit"

  # Wat de ESPHome-bridge naar de warmtepomp stuurt: de sensor
  # "Aanvoersetpoint (naar boiler)" van de bridge. Met de bridge-YAML uit deze
  # repo (friendly_name "WeHeat OpenTherm") heet die zo. Heb je de bridge een
  # andere naam gegeven, dan verandert het begin van de entity-ID mee.
  setpoint_sent_entity: "sensor.weheat_opentherm_aanvoersetpoint_naar_boiler"

  # Status van de warmtepomp uit de officiële WeHeat-integratie. De naam hangt
  # af van je model (bijvoorbeeld sensor.flint_p40_heat_pump). De boog kleurt op
  # de toestanden heating (oranje), defrosting (wit) en cooling (blauw); elke
  # andere toestand is grijs.
  pump_status_entity: "sensor.weheat_heat_pump"

  # Buitentemperatuur rechtsboven, een willekeurige temperatuursensor.
  outside_temp_entity: "sensor.buitentemperatuur"

  # Grenzen voor de − en + knoppen (°C, stappen van 0,5).
  thermostat_min: "10"
  thermostat_max: "25"

# ============================================================
#  Hardware basis
# ============================================================

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 200
    then:
      - light.turn_on:
          id: backlight
          brightness: 100%

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_8MB: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: UART0
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# ============================================================
#  Lettertype voor de grote kamertemperatuur
#  (groter dan de ingebouwde montserrat_48)
# ============================================================

font:
  - file: "gfonts://Roboto"
    id: roboto_112
    size: 112
    bpp: 4
    glyphs: "0123456789.-°"

# ============================================================
#  Hardware peripherals
# ============================================================

i2c:
  - id: bus_a
    sda: GPIO39
    scl: GPIO40
    scan: false

spi:
  - id: lcd_spi
    clk_pin: GPIO41
    mosi_pin: GPIO48
    miso_pin: GPIO47

pca9554:
  - id: pca9554a_device
    address: 0x20
    pin_count: 16

output:
  - platform: ledc
    pin:
      number: GPIO45
      ignore_strapping_warning: true
    id: ledc_gpio45
    frequency: 100Hz

light:
  - platform: monochromatic
    name: "Backlight"
    id: backlight
    output: ledc_gpio45
    restore_mode: ALWAYS_ON

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO38
      inverted: true
    name: "User Button"
    on_press:
      - if:
          condition:
            light.is_on: backlight
          then:
            - light.turn_off: backlight
          else:
            - light.turn_on:
                id: backlight
                brightness: 100%

display:
  - platform: mipi_rgb
    model: SEEED-INDICATOR-D1
    id: sensecap_display

touchscreen:
  platform: ft5x06
  id: sensecap_touchscreen
  transform:
    mirror_x: true
    mirror_y: true
  on_release:
      - light.turn_on:
          id: backlight
          brightness: 100%

# ============================================================
#  Globale variabele — houdt het doel bij voor de − en + knoppen
# ============================================================

globals:
  - id: thermo_target_value
    type: float
    restore_value: false
    initial_value: "20.0"

# ============================================================
#  Home Assistant sensoren
# ============================================================

sensor:
  - platform: homeassistant
    id: ha_outside_temp
    entity_id: ${outside_temp_entity}
    on_value:
      - lvgl.label.update:
          id: lbl_outside
          text:
            format: "%.1f°"
            args: [x]

  - platform: homeassistant
    id: ha_boiler_setpoint
    entity_id: ${setpoint_sent_entity}
    on_value:
      - lvgl.label.update:
          id: lbl_boiler
          text:
            format: "%.1f°"
            args: [x]

  - platform: homeassistant
    id: ha_thermo_current
    entity_id: ${thermostat_entity}
    attribute: current_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_thermo_current
          text:
            format: "%.1f°"
            args: [x]
      - lambda: |-
          // Positie op de boog (135° tot 45° via de bovenkant = 270°)
          float ratio = (x - 5.0f) / 25.0f;  // 5–30 °C → 0.0–1.0
          if (ratio < 0.0f) ratio = 0.0f;
          if (ratio > 1.0f) ratio = 1.0f;
          float angle_deg = 135.0f + ratio * 270.0f;
          float angle_rad = angle_deg * 3.14159265f / 180.0f;
          // Middelpunt van de boog (40+200, 30+200) = (240, 230), straal 200
          int cx = 240, cy = 230, r = 200;
          int dx = cx + (int)(r * cosf(angle_rad));
          int dy = cy + (int)(r * sinf(angle_rad));
          // Stip is 16×16, dus midden op dx,dy
          lv_obj_set_pos(id(current_temp_dot), dx - 8, dy - 8);

  - platform: homeassistant
    id: ha_thermo_target
    entity_id: ${thermostat_entity}
    attribute: temperature
    on_value:
      - lambda: |-
          id(thermo_target_value) = x;
      - lvgl.arc.update:
          id: thermo_arc
          value: !lambda return (int)(x * 10.0f);
      - lvgl.label.update:
          id: lbl_setpoint_inside
          text:
            format: "%.1f°"
            args: [x]

text_sensor:
  - platform: homeassistant
    id: ha_heatpump_status
    entity_id: ${pump_status_entity}
    on_value:
      - lambda: |-
          uint32_t color;
          std::string status(x);
          if (status == "heating") {
            color = 0xff7043;
          } else if (status == "defrosting") {
            // Ontdooien is geen koelen: wit, zodat het niet op koelen lijkt
            color = 0xffffff;
          } else if (status == "cooling") {
            color = 0x4fc3f7;
          } else {
            color = 0x8b949e;
          }
          lv_obj_set_style_arc_color(id(thermo_arc), lv_color_hex(color), LV_PART_INDICATOR);

# ============================================================
#  LVGL — één pagina (480×480)
#
#  Linksboven: aanvoersetpoint naar de warmtepomp (oranje)
#  Rechtsboven: buitentemperatuur (blauw)
#  Midden: boog met het doel, witte stip op de kamertemperatuur,
#          grote kamertemperatuur en daaronder het doel
#  Onder: − en + knoppen voor het doel
# ============================================================

lvgl:
  displays:
    - sensecap_display
  touchscreens:
    - sensecap_touchscreen

  theme:
    dark_mode: true

  pages:
    - id: thermostat_page
      bg_color: 0x0d1117
      bg_opa: COVER
      widgets:

        # Bovenste rij
        - label:
            id: lbl_boiler
            x: 10
            y: 6
            width: 120
            text: "--°"
            text_font: montserrat_32
            text_color: 0xff7043
            text_align: LEFT

        - label:
            id: lbl_outside
            x: 335
            y: 2
            width: 135
            text: "--°"
            text_font: montserrat_42
            text_color: 0x4fc3f7
            text_align: RIGHT

        # Boog (400×400, bereik 5.0–30.0 °C ×10): het doel
        - arc:
            id: thermo_arc
            x: 40
            y: 30
            width: 400
            height: 400
            min_value: 50
            max_value: 300
            value: 200
            arc_color: 0x30363d
            arc_width: 26
            start_angle: 135
            end_angle: 45
            bg_opa: TRANSP
            indicator:
              arc_color: 0xff7043
              arc_width: 26
            knob:
              bg_opa: TRANSP
              border_width: 0

        # Witte stip op de boog voor de kamertemperatuur
        - obj:
            id: current_temp_dot
            x: 232
            y: 22
            width: 16
            height: 16
            radius: 8
            bg_color: 0xffffff
            bg_opa: COVER
            border_width: 2
            border_color: 0x333333

        # Kamertemperatuur in het midden van de boog
        - label:
            id: lbl_thermo_current
            x: 40
            y: 124
            width: 400
            text: "--°"
            text_font: roboto_112
            text_color: 0xffffff
            text_align: CENTER

        - label:
            x: 40
            y: 260
            width: 400
            text: "huidig"
            text_font: montserrat_16
            text_color: 0x8b949e
            text_align: CENTER

        # Doel
        - label:
            id: lbl_setpoint_inside
            x: 40
            y: 288
            width: 400
            text: "--°"
            text_font: montserrat_48
            text_color: 0xc0c0c0
            text_align: CENTER

        # − en + knoppen
        - button:
            x: 136
            y: 392
            width: 90
            height: 66
            bg_color: 0x21262d
            radius: 12
            border_width: 1
            border_color: 0x30363d
            on_click:
              - lambda: |-
                  float v = id(thermo_target_value) - 0.5;
                  if (v < ${thermostat_min}.0f) v = ${thermostat_min}.0f;
                  id(thermo_target_value) = v;
              - homeassistant.action:
                  action: climate.set_temperature
                  data:
                    entity_id: ${thermostat_entity}
                    temperature: !lambda return id(thermo_target_value);
            widgets:
              - label:
                  align: CENTER
                  text: "-"
                  text_font: montserrat_42
                  text_color: 0xff7043

        - button:
            x: 254
            y: 392
            width: 90
            height: 66
            bg_color: 0x21262d
            radius: 12
            border_width: 1
            border_color: 0x30363d
            on_click:
              - lambda: |-
                  float v = id(thermo_target_value) + 0.5;
                  if (v > ${thermostat_max}.0f) v = ${thermostat_max}.0f;
                  id(thermo_target_value) = v;
              - homeassistant.action:
                  action: climate.set_temperature
                  data:
                    entity_id: ${thermostat_entity}
                    temperature: !lambda return id(thermo_target_value);
            widgets:
              - label:
                  align: CENTER
                  text: "+"
                  text_font: montserrat_42
                  text_color: 0xff7043
