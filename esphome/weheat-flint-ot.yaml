substitutions:
  device_name: weheat-flint-ot
  friendly_name: "WeHeat Flint Thermostat"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} AP"
    password: !secret ap_password

captive_portal:

logger:
  level: INFO
  logs:
    component: ERROR

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

# ─── OpenTherm Hub ───────────────────────────────────────────────────────────
#
# t_set leest het berekende aanvoersetpoint rechtstreeks uit de HA-integratie.
# Entity: sensor.weheat_opentherm_aanvoersetpoint
# (aangemaakt door de weheat_opentherm custom integratie)
#
opentherm:
  in_pin: GPIO10
  out_pin: GPIO11
  sync_mode: false
  t_set: stooklijn_setpoint
  # ch_enable / cooling_enable worden NIET hier gespecificeerd.
  # Ze worden beheerd door de switches beneden (ch_enable_switch /
  # cooling_enable_switch), die automatisch worden gezet door de
  # automation op text_sensor "actieve_modus".

# ─── Sensors ─────────────────────────────────────────────────────────────────
sensor:
  # Aanvoersetpoint, ontvangen van de HA weheat_opentherm integratie.
  # name: zorgt dat de ontvangen waarde ook als HA-entity zichtbaar wordt
  # (handig om te verifiëren dat de ESP echt waarden binnen krijgt).
  # filter_out: nan zorgt dat het laatste geldige setpoint behouden blijft
  # als de verbinding met HA tijdelijk wegvalt.
  - platform: homeassistant
    id: stooklijn_setpoint
    name: "Aanvoersetpoint (ontvangen van HA)"
    entity_id: sensor.weheat_opentherm_aanvoersetpoint
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - filter_out: nan

  # Wat de ESP daadwerkelijk naar de OpenTherm-bus stuurt als t_set.
  # Zou identiek moeten zijn aan stooklijn_setpoint; verschilt alleen als
  # filter_out een NaN wegfiltert (dan blijft de laatste geldige waarde staan).
  - platform: template
    name: "Aanvoersetpoint (naar boiler)"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      return id(stooklijn_setpoint).state;

  # Kamertemperatuur (voor weergave/logging)
  - platform: homeassistant
    id: kamertemperatuur
    entity_id: sensor.bth_3ab2_temperatuur

  # OpenTherm boilersensoren
  - platform: opentherm
    rel_mod_level:
      name: "Modulatieniveau"
      unit_of_measurement: "%"
    t_boiler:
      name: "Aanvoertemperatuur (gemeten)"
      unit_of_measurement: "°C"
    t_ret:
      name: "Retourtemperatuur"
      unit_of_measurement: "°C"
    ch_pressure:
      name: "CV-druk"
      unit_of_measurement: "bar"
    t_outside:
      name: "Buitentemperatuur (WeHeat)"
      unit_of_measurement: "°C"
    burner_starts:
      name: "Branderstarts"
    burner_operation_hours:
      name: "Branderuren"
      unit_of_measurement: "h"
    ch_pump_operation_hours:
      name: "CV-pompuren"
      unit_of_measurement: "h"

  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "WiFi signaal"
    update_interval: 60s

# ─── Binary Sensors ───────────────────────────────────────────────────────────
binary_sensor:
  - platform: opentherm
    flame_on:
      name: "Brander aan"
    ch_active:
      name: "CV actief"
    fault_indication:
      name: "Storing"
      device_class: problem
      entity_category: diagnostic
    diagnostic_indication:
      name: "Diagnose-event"
      entity_category: diagnostic
    low_water_pressure:
      name: "Lage waterdruk"
      device_class: problem
      entity_category: diagnostic
  - platform: status
    name: "Apparaatstatus"

# ─── Switches ─────────────────────────────────────────────────────────────────
# Deze switches sturen de OpenTherm ch_enable / cooling_enable bits.
# Ze worden automatisch gezet door de automation op text_sensor "actieve_modus".
# Diagnostic category: zichtbaar in HA voor debug, maar handmatige toggle
# wordt direct overschreven zodra de integratie een nieuwe modus stuurt.
switch:
  - platform: opentherm
    ch_enable:
      name: "CV inschakelen"
      id: ch_enable_switch
      restore_mode: ALWAYS_OFF
      entity_category: diagnostic
    cooling_enable:
      name: "Koeling inschakelen"
      id: cooling_enable_switch
      restore_mode: ALWAYS_OFF
      entity_category: diagnostic

status_led:
  pin: GPIO8

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP-adres"

  # Leest de EFFECTIEVE modus uit de integratie (heat / cool / off).
  # Verschil met climate.hvac_mode: deze sensor houdt rekening met de
  # stookgrens en koelgrens. Bij climate=HEAT maar buitentemp boven stookgrens
  # geeft deze "off" terug — warmtepomp stopt automatisch.
  #
  # on_value automation schakelt de twee opentherm switches gelijktijdig.
  - platform: homeassistant
    id: actieve_modus
    name: "Actieve modus (van integratie)"
    entity_id: sensor.weheat_opentherm_actieve_modus
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x == "heat";'
            then:
              - switch.turn_on: ch_enable_switch
              - switch.turn_off: cooling_enable_switch
        - if:
            condition:
              lambda: 'return x == "cool";'
            then:
              - switch.turn_off: ch_enable_switch
              - switch.turn_on: cooling_enable_switch
        - if:
            condition:
              lambda: 'return x != "heat" && x != "cool";'
            then:
              - switch.turn_off: ch_enable_switch
              - switch.turn_off: cooling_enable_switch
