substitutions:
  device_name: weheat-flint-ot
  friendly_name: "WeHeat Flint Thermostat"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} AP"
    password: !secret ap_password

captive_portal:

logger:
  level: INFO
  logs:
    component: ERROR

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

# ─── OpenTherm Hub ───────────────────────────────────────────────────────────
#
# t_set leest het berekende aanvoersetpoint rechtstreeks uit de HA-integratie.
# Entity: sensor.weheat_opentherm_aanvoersetpoint
# (aangemaakt door de weheat_opentherm custom integratie)
#
opentherm:
  in_pin: GPIO10
  out_pin: GPIO11
  sync_mode: false
  t_set: stooklijn_setpoint
  ch_enable: ch_enable_switch

# ─── Sensors ─────────────────────────────────────────────────────────────────
sensor:
  # Aanvoersetpoint, berekend door de HA weheat_opentherm integratie.
  # filter_out: nan zorgt dat het laatste geldige setpoint behouden blijft
  # als de verbinding met HA tijdelijk wegvalt.
  - platform: homeassistant
    id: stooklijn_setpoint
    entity_id: sensor.weheat_opentherm_aanvoersetpoint
    filters:
      - filter_out: nan

  # Kamertemperatuur (voor weergave/logging)
  - platform: homeassistant
    id: kamertemperatuur
    entity_id: sensor.bth_3ab2_temperatuur

  # OpenTherm boilersensoren
  - platform: opentherm
    rel_mod_level:
      name: "Modulatieniveau"
      unit_of_measurement: "%"
    t_boiler:
      name: "Aanvoertemperatuur (gemeten)"
      unit_of_measurement: "°C"
    t_ret:
      name: "Retourtemperatuur"
      unit_of_measurement: "°C"
    ch_pressure:
      name: "CV-druk"
      unit_of_measurement: "bar"
    t_outside:
      name: "Buitentemperatuur (WeHeat)"
      unit_of_measurement: "°C"
    burner_starts:
      name: "Branderstarts"
    burner_operation_hours:
      name: "Branderuren"
      unit_of_measurement: "h"
    ch_pump_operation_hours:
      name: "CV-pompuren"
      unit_of_measurement: "h"

  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "WiFi signaal"
    update_interval: 60s

# ─── Binary Sensors ───────────────────────────────────────────────────────────
binary_sensor:
  - platform: opentherm
    flame_on:
      name: "Brander aan"
    ch_active:
      name: "CV actief"
    fault_indication:
      name: "Storing"
      device_class: problem
      entity_category: diagnostic
    diagnostic_indication:
      name: "Diagnose-event"
      entity_category: diagnostic
    low_water_pressure:
      name: "Lage waterdruk"
      device_class: problem
      entity_category: diagnostic
  - platform: status
    name: "Apparaatstatus"

# ─── Switches ─────────────────────────────────────────────────────────────────
# ch_enable_switch stuurt de opentherm ch_enable aan (zie bovenaan).
# Standaard AAN bij herstart. Vanuit HA uit te schakelen als verwarming
# niet gewenst is (vakantie, zomer, etc.).
switch:
  - platform: opentherm
    id: ch_enable_switch
    ch_enable:
      name: "CV inschakelen"
      restore_mode: RESTORE_DEFAULT_ON

status_led:
  pin: GPIO8

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP-adres"
